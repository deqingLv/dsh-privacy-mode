# Boot snapshot is shared by all expressions; saved choices take effect next boot.
- id: session-telemetry-otel
  name: '@deepseek-ai/dsh-session-telemetry-otel'
  config:
    mode: !!js "!!(ctx.get('profileContext')?.dir && process.getBuiltinModule('module').createRequire(ctx.get('profileContext').dir + '/package.json')('dsh-privacy-mode/boot-policy').resolveBootPolicy(ctx).channels.feedback) ? 'FEEDBACK_ONLY' : 'DISABLED'"
    shutdownTimeoutMillis: 3000
    maxRequestBytes: 4000000
    exporter:
      url: !!js "process.env.DSH_TELEMETRY_OTLP_URL ?? 'https://dsh-otel-collector.deepseeksvc.com/v1/logs'"
      compression: gzip
      timeoutMillis: 1000
    processor:
      scheduledDelayMillis: 10000
      maxQueueSize: 2048
      maxExportBatchSize: 2048
      exportTimeoutMillis: 1500
- id: session-log-deepseek
  name: '@deepseek-ai/dsh-session-log-deepseek'
  config:
    enabled: !!js "!!(ctx.get('profileContext')?.dir && process.getBuiltinModule('module').createRequire(ctx.get('profileContext').dir + '/package.json')('dsh-privacy-mode/boot-policy').resolveBootPolicy(ctx).channels.sessionLog)"
- id: plugin-package-inventory-deepseek
  name: '@deepseek-ai/dsh-plugin-package-inventory-deepseek'
  config:
    enabled: !!js "!!(ctx.get('profileContext')?.dir && process.getBuiltinModule('module').createRequire(ctx.get('profileContext').dir + '/package.json')('dsh-privacy-mode/boot-policy').resolveBootPolicy(ctx).channels.inventory)"
- id: desktop-product-telemetry
  name: '@deepseek-ai/dsh-host-product-telemetry-otel'
  disabled: !!js "ctx.get('profileContext')?.name !== 'desktop' || !!!(ctx.get('profileContext')?.dir && process.getBuiltinModule('module').createRequire(ctx.get('profileContext').dir + '/package.json')('dsh-privacy-mode/boot-policy').resolveBootPolicy(ctx).channels.productExport)"
  config:
    scheduledDelayMillis: 30000
    timeoutMillis: 15000
    exportTimeoutMillis: 20000
    shutdownTimeoutMillis: 2000
    serviceName: deepseek-harness-desktop
    serviceVersion: !!js process.env.DSH_CLIENT_VERSION
    endpoint: !!js process.env.DSH_PRODUCT_ANALYTICS_OTLP_URL
- id: product-analytics
  name: '@deepseek-ai/dsh-client-product-analytics'
  disabled: !!js "ctx.get('profileContext')?.name !== 'desktop'"
  config:
    enabled: !!js "!!(ctx.get('profileContext')?.dir && process.getBuiltinModule('module').createRequire(ctx.get('profileContext').dir + '/package.json')('dsh-privacy-mode/boot-policy').resolveBootPolicy(ctx).channels.productAnalytics)"
    appVersion: !!js process.env.DSH_CLIENT_VERSION
- insert:
    - id: privacy-mode-product-sink
      name: dsh-privacy-mode/product-sink
      disabled: !!js "ctx.get('profileContext')?.name !== 'desktop' || !!(ctx.get('profileContext')?.dir && process.getBuiltinModule('module').createRequire(ctx.get('profileContext').dir + '/package.json')('dsh-privacy-mode/boot-policy').resolveBootPolicy(ctx).channels.productExport)"
    - id: privacy-mode
      name: dsh-privacy-mode
